/* =====================================
   NAVIGATION
===================================== */

function showPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));

  $(page).classList.add("active");

  const navButton = document.querySelector('[data-page="' + page + '"]');
  if(navButton) navButton.classList.add("active");

  if(page === "favorites") renderFavorites();
  if(page === "meals") renderMeals();
  if(page === "recipes") renderAllRecipes();

  window.scrollTo({top:0,behavior:"smooth"});
}

/* =====================================
   TOAST MESSAGE
===================================== */

let toastTimer;

function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  },2500);
}

/* =====================================
   INGREDIENTS
===================================== */

function normalize(value) {
  return value.toLowerCase().trim().replace(/s$/,"");
}

function addIngredients(value) {
  const additions = value.split(",")
    .map(x => x.trim().toLowerCase())
    .filter(Boolean);

  let added = 0;

  additions.forEach(item => {
    if(item.length > 40) return;

    if(!ingredients.some(x => normalize(x) === normalize(item))) {
      ingredients.push(item);
      added++;
    }
  });

  saveData("ptp_ingredients",ingredients);
  renderIngredients();
  updateStats();

  if(added) showToast(added + " ingredient(s) added");
}

function renderIngredients() {
  const list = $("ingredientList");
  list.replaceChildren();

  if(!ingredients.length) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.textContent = "No ingredients added yet.";
    list.appendChild(empty);
  }

  ingredients.forEach((item,index) => {
    const chip = document.createElement("span");
    chip.className = "ingredient-chip";

    const name = document.createElement("span");
    name.textContent = item;

    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "×";
    remove.setAttribute("aria-label","Remove " + item);

    remove.onclick = () => {
      ingredients.splice(index,1);
      saveData("ptp_ingredients",ingredients);
      renderIngredients();
      updateStats();
    };

    chip.append(name,remove);
    list.appendChild(chip);
  });
}

$("addIngredient").addEventListener("click",() => {
  addIngredients($("ingredientInput").value);
  $("ingredientInput").value = "";
  $("ingredientInput").focus();
});

$("ingredientInput").addEventListener("keydown",e => {
  if(e.key === "Enter") $("addIngredient").click();
});

$("sampleIngredients").addEventListener("click",() => {
  addIngredients("eggs, chicken, pasta, cheese, tomatoes, garlic, rice, broccoli, bananas, oats, black beans");
});

$("clearIngredients").addEventListener("click",() => {
  if(!ingredients.length) return;

  if(confirm("Clear all your kitchen ingredients?")) {
    ingredients = [];
    saveData("ptp_ingredients",ingredients);
    renderIngredients();
    updateStats();
    showToast("Kitchen cleared");
  }
});

/* =====================================
   MATCHING RECIPES
===================================== */

function ingredientMatch(a,b) {
  const x = normalize(a);
  const y = normalize(b);
  return x === y || x.includes(y) || y.includes(x);
}

function getMatches(recipe) {
  return recipe.ingredients.filter(required =>
    ingredients.some(have => ingredientMatch(have,required))
  );
}

function getRankedRecipes() {
  const diet = $("diet").value;
  const maxTime = Number($("maxTime").value);

  return recipes.map(recipe => {
    const matched = getMatches(recipe);

    return {
      ...recipe,
      matched,
      score:Math.round(matched.length / recipe.ingredients.length * 100)
    };
  })
  .filter(recipe => recipe.matched.length > 0)
  .filter(recipe => recipe.time <= maxTime)
  .filter(recipe => {
    if(diet === "vegan") return recipe.category === "vegan";
    if(diet === "vegetarian") return ["vegetarian","vegan"].includes(recipe.category);
    if(diet === "high-protein") return recipe.category === "high-protein";
    return true;
  })
  .sort((a,b) => b.score - a.score);
}

function findMeals() {
  if(!ingredients.length) {
    $("kitchenNotice").textContent = "Add some ingredients first so we can find meals for you.";
    $("kitchenNotice").style.display = "block";
    return;
  }

  $("kitchenNotice").style.display = "none";

  const matches = getRankedRecipes();

  showPage("recipes");

  $("recipeSearch").value = "";
  $("recipeCategory").value = "all";
  $("recipeTime").value = "999";

  renderAllRecipes(matches);

  showToast(matches.length + " matching recipes found");
}

/* =====================================
   FAVORITES
===================================== */

function toggleFavorite(name) {
  if(favorites.includes(name)) {
    favorites = favorites.filter(x => x !== name);
    showToast("Removed from favorites");
  } else {
    favorites.push(name);
    showToast("Saved to your favorites ♥");
  }

  saveData("ptp_favorites",favorites);

  renderFavorites();
  renderAllRecipes();
  renderHomeRecipes();
  updateStats();
}

function isFavorite(name) {
  return favorites.includes(name);
}

/* =====================================
   RECIPE CARD CREATION
===================================== */

function createRecipeCard(recipe,showMatch = false) {
  const card = document.createElement("article");
  card.className = "recipe-card";

  const photo = document.createElement("div");
  photo.className = "recipe-image";
  photo.style.backgroundImage = "url(" + JSON.stringify(recipe.image) + ")";

  const emoji = document.createElement("span");
  emoji.className = "recipe-emoji";
  emoji.textContent = recipe.emoji;
  photo.appendChild(emoji);

  const badge = document.createElement("span");
  badge.className = "recipe-badge";
  badge.textContent = showMatch ? recipe.score + "% ingredient match" : recipe.category;
  photo.appendChild(badge);

  const heart = document.createElement("button");
  heart.className = "favorite-btn" + (isFavorite(recipe.name) ? " saved" : "");
  heart.textContent = isFavorite(recipe.name) ? "♥" : "♡";
  heart.setAttribute("aria-label","Toggle favorite");
  heart.onclick = () => toggleFavorite(recipe.name);
  photo.appendChild(heart);

  const body = document.createElement("div");
  body.className = "recipe-body";

  const title = document.createElement("h3");
  title.textContent = recipe.name;

  const description = document.createElement("p");
  description.className = "recipe-description";
  description.textContent = recipe.description;

  const meta = document.createElement("div");
  meta.className = "recipe-meta";
  meta.textContent = "◷ " + recipe.time + " minutes  ·  " + recipe.ingredients.length + " main ingredients";

  body.append(title,description,meta);

  if(showMatch) {
    const missing = recipe.ingredients.filter(item =>
      !recipe.matched.some(have => ingredientMatch(have,item))
    );

    const info = document.createElement("div");
    info.className = "match-info";
    info.textContent = "You have: " + recipe.matched.join(", ") +
      (missing.length ? " · Still needed: " + missing.join(", ") : " · You have everything!");
    body.appendChild(info);
  }

  const actions = document.createElement("div");
  actions.className = "recipe-actions";

  const view = document.createElement("button");
  view.textContent = "View recipe ↓";

  const details = document.createElement("div");
  details.className = "details";

  const ingredientHeading = document.createElement("h4");
  ingredientHeading.textContent = "Ingredients";

  const ingredientUl = document.createElement("ul");

  [...recipe.ingredients,...recipe.optional.map(x => x + " (optional)")].forEach(item => {
    const li = document.createElement("li");
    li.textContent = item;
    ingredientUl.appendChild(li);
  });

  const methodHeading = document.createElement("h4");
  methodHeading.textContent = "Cooking instructions";

  const steps = document.createElement("ol");

  recipe.steps.forEach(step => {
    const li = document.createElement("li");
    li.textContent = step;
    steps.appendChild(li);
  });

  details.append(ingredientHeading,ingredientUl,methodHeading,steps);

  view.onclick = () => {
    details.classList.toggle("open");
    view.textContent = details.classList.contains("open") ? "Hide recipe ↑" : "View recipe ↓";
  };

  const save = document.createElement("button");
  save.textContent = "Save to My Meals";
  save.onclick = () => {
    openMealModal(recipe.name);
  };

  actions.append(view,save);
  body.append(actions,details);
  card.append(photo,body);

  return card;
}

/* =====================================
   RENDER RECIPES
===================================== */

function renderAllRecipes(preloaded) {
  const grid = $("allRecipes");
  grid.replaceChildren();

  const search = $("recipeSearch").value.toLowerCase();
  const category = $("recipeCategory").value;
  const time = Number($("recipeTime").value);

  let collection = preloaded || recipes;

  if(!preloaded) {
    collection = recipes.filter(recipe =>
      recipe.name.toLowerCase().includes(search) ||
      recipe.description.toLowerCase().includes(search) ||
      recipe.ingredients.some(x => x.includes(search))
    )
    .filter(recipe => category === "all" || recipe.category === category)
    .filter(recipe => recipe.time <= time);
  }

  if(!collection.length) {
    grid.appendChild(emptyState("No recipes found","Try another search or change your filters.","🍲"));
    return;
  }

  collection.forEach(recipe => {
    grid.appendChild(createRecipeCard(recipe,!!preloaded));
  });
}

function renderFavorites() {
  const grid = $("favoriteRecipes");
  grid.replaceChildren();

  const saved = recipes.filter(recipe => favorites.includes(recipe.name));

  if(!saved.length) {
    grid.appendChild(emptyState(
      "Your cookbook is waiting!",
      "Tap the heart on any recipe to save it here.",
      "♥"
    ));
    return;
  }

  saved.forEach(recipe => grid.appendChild(createRecipeCard(recipe)));
}

function renderHomeRecipes() {
  const grid = $("homeRecipes");
  grid.replaceChildren();

  recipes.slice(0,3).forEach(recipe => {
    grid.appendChild(createRecipeCard(recipe));
  });
}

/* =====================================
   EMPTY STATES
===================================== */

function emptyState(title,description,emoji) {
  const box = document.createElement("div");
  box.className = "empty-state";

  const icon = document.createElement("div");
  icon.className = "big-icon";
  icon.textContent = emoji;

  const heading = document.createElement("h3");
  heading.textContent = title;

  const text = document.createElement("p");
  text.textContent = description;

  box.append(icon,heading,text);
  return box;
}

/* =====================================
   MY MEALS / FOOD JOURNAL
===================================== */

function openMealModal(recipeName = "") {
  $("mealModal").classList.add("open");
  $("mealName").value = recipeName;
  $("mealDate").value = new Date().toLocaleDateString("en-CA");

  const select = $("mealRecipe");
  select.replaceChildren();

  const own = document.createElement("option");
  own.value = "";
  own.textContent = "My own meal";
  select.appendChild(own);

  recipes.forEach(recipe => {
    const option = document.createElement("option");
    option.value = recipe.name;
    option.textContent = recipe.name;
    select.appendChild(option);
  });

  select.value = recipeName;
}

function closeMealModal() {
  $("mealModal").classList.remove("open");
}

function saveMeal() {
  const name = $("mealName").value.trim();
  const date = $("mealDate").value;
  const notes = $("mealNotes").value.trim();
  const recipe = $("mealRecipe").value;

  if(!name || !date) {
    showToast("Enter a meal name and date first.");
    return;
  }

  meals.unshift({
    id:Date.now().toString(),
    name,
    date,
    notes,
    recipe
  });

  saveData("ptp_meals",meals);

  $("mealName").value = "";
  $("mealNotes").value = "";

  closeMealModal();
  renderMeals();
  updateStats();

  showToast("Your meal has been saved!");
}

function renderMeals() {
  const log = $("mealLog");
  log.replaceChildren();

  $("mealTotal").textContent = meals.length + (meals.length === 1 ? " meal" : " meals");

  if(!meals.length) {
    log.appendChild(emptyState(
      "Your cooking journey starts here",
      "Save the meals you make to build your own food journal.",
      "🍽️"
    ));
    return;
  }

  meals.forEach(meal => {
    const entry = document.createElement("div");
    entry.className = "meal-entry";

    const info = document.createElement("div");

    const heading = document.createElement("h3");
    heading.textContent = "🍽️ " + meal.name;

    const date = document.createElement("p");
    date.textContent = "Made on " + new Date(meal.date + "T12:00:00").toLocaleDateString();

    const notes = document.createElement("p");
    notes.textContent = meal.notes || (meal.recipe ? "Recipe: " + meal.recipe : "Personal meal");

    info.append(heading,date,notes);

    const remove = document.createElement("button");
    remove.className = "delete-btn";
    remove.textContent = "Delete";
    remove.onclick = () => {
      if(confirm("Delete this saved meal?")) {
        meals = meals.filter(x => x.id !== meal.id);
        saveData("ptp_meals",meals);
        renderMeals();
        updateStats();
        showToast("Meal deleted");
      }
    };

    entry.append(info,remove);
    log.appendChild(entry);
  });
}

/* =====================================
   HOME DASHBOARD
===================================== */

function updateStats() {
  $("homeIngredients").textContent = ingredients.length;
  $("homeFavorites").textContent = favorites.length;
  $("homeMeals").textContent = meals.length;
  $("favoriteCount").textContent = favorites.length;
}

/* =====================================
   PHOTO UPLOAD
===================================== */

function setPhoto(file) {
  if(!file) return;

  if(!file.type.startsWith("image/")) {
    showToast("Please choose an image.");
    return;
  }

  if(file.size > 15 * 1024 * 1024) {
    showToast("Choose an image smaller than 15 MB.");
    return;
  }

  selectedPhoto = file;

  if(photoURL) URL.revokeObjectURL(photoURL);
  photoURL = URL.createObjectURL(file);

  $("photoPreview").src = photoURL;
  $("photoPreview").style.display = "block";
  $("uploadPrompt").style.display = "none";
  $("removePhoto").style.display = "inline-block";

  $("photoStatus").textContent = "Photo uploaded successfully. Automatic AI identification is not connected.";
}

$("photoInput").addEventListener("change",e => {
  setPhoto(e.target.files[0]);
});

$("removePhoto").addEventListener("click",() => {
  selectedPhoto = null;

  $("photoInput").value = "";
  $("photoPreview").removeAttribute("src");
  $("photoPreview").style.display = "none";
  $("uploadPrompt").style.display = "block";
  $("removePhoto").style.display = "none";

  if(photoURL) URL.revokeObjectURL(photoURL);
  photoURL = null;

  $("photoStatus").textContent = "Photo preview is available. Automatic AI identification requires a connected AI service.";
});

$("scanBtn").addEventListener("click",() => {
  if(!selectedPhoto) {
    showToast("Upload a photo first.");
    return;
  }

  $("kitchenNotice").textContent =
    "Your photo is uploaded, but automatic ingredient identification requires a connected AI service. Your photo has not been analyzed. You can still add ingredients manually.";
  $("kitchenNotice").style.display = "block";
});

const dropzone = $("dropzone");

dropzone.addEventListener("dragover",e => {
  e.preventDefault();
  dropzone.style.borderColor = "#347454";
});

dropzone.addEventListener("dragleave",() => {
  dropzone.style.borderColor = "";
});

dropzone.addEventListener("drop",e => {
  e.preventDefault();
  dropzone.style.borderColor = "";
  setPhoto(e.dataTransfer.files[0]);
});

/* =====================================
   STARTUP
===================================== */

function initialize() {
  renderIngredients();
  renderHomeRecipes();
  renderFavorites();
  renderMeals();
  updateStats();
}

$("mealModal").addEventListener("click",e => {
  if(e.target === $("mealModal")) closeMealModal();
});

initialize();

</script>

